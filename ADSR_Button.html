<!DOCTYPE html>
<html lang = "en">
<meta charset="UTF-8">
<title>ADSR_Works</title>
</head>
<body>

    <button id="btn-short">Short</button>
    <button id="btn-long">Long</button>

    <script>
        function playNote(someContext, frequency, duration, attackTime)
        {
            const osc1 = new OscillatorNode(someContext);
            const osc2 = new OscillatorNode(someContext);
            const gain = new GainNode(someContext);
        
            
            osc1.frequency.value = frequency;
            osc2.frequency.value = frequency*2.05;
            osc1.type = "sine"
            osc2.type = "sine"
            gain.gain.value = 0;

            osc1.connect(gain).connect(someContext.destination);
            osc2.connect(gain).connect(someContext.destination);

            let now = someContext.currentTime;

            gain.gain.linearRampToValueAtTime(0.10, now + attackTime); //attack
            gain.gain.linearRampToValueAtTime(0, now + duration); //release

            osc1.start();
            osc1.stop(now + duration);

            osc2.start();
            osc2.stop(now + duration);

        }

        const myCtx = new AudioContext();
        
        // button 1

        document.querySelector("#btn-short").onclick = () => {
            playNote(myCtx, 60, 0.3, 0.05);
        };

        // button 2

        document.querySelector("#btn-long").onclick = () => {
            playNote(myCtx, 90, 1.5, 0.6);
        };
    </script>
    
</body>

</html>
